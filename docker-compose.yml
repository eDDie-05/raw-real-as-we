services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raw
      POSTGRES_USER: raw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raw -d raw"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-only-change-before-deploying}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://raw:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/raw
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    ports:
      - "8000:8000"
    volumes:
      - raw_media:/app/media
volumes:
  postgres_data:
  raw_media:
